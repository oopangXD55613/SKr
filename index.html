    function isTimeOverlapping(startA, endA, startB, endB) {
      return !(endA <= startB || startA >= endB);
    }

    // =========================================================================
    // MAIN REACT APPLICATION
    // =========================================================================
    function FacilityBookingApp() {
      // Current logged in user (null = แสดงหน้า Login)
      const [currentUser, setCurrentUser] = useState(() => {
        const saved = localStorage.getItem('sakonraj_logged_user');
        return saved ? JSON.parse(saved) : null;
      });

      // Login form states
      const [loginCitizenId, setLoginCitizenId] = useState('');
      const [loginPassword, setLoginPassword] = useState('');
      const [loginError, setLoginError] = useState('');
      const [loginLoading, setLoginLoading] = useState(false);

      // System data states
      const [venues, setVenues] = useState(DEFAULT_VENUES);
      const [bookings, setBookings] = useState([]);
      const [profiles, setProfiles] = useState(DEFAULT_PROFILES);
      const [systemNotifications, setSystemNotifications] = useState([]);
      const [actionMessage, setActionMessage] = useState(null);

      // Calendar Navigation State
      const [currentYear, setCurrentYear] = useState(2026); // ค.ศ.
      const [currentMonth, setCurrentMonth] = useState(8); // 8 = กันยายน (0-indexed)
      const [selectedDate, setSelectedDate] = useState('2026-09-12');

      // Modals
      const [isQuickBookingOpen, setIsQuickBookingOpen] = useState(false);
      const [isAdminDayModalOpen, setIsAdminDayModalOpen] = useState(false);
      const [isTeacherNotifOpen, setIsTeacherNotifOpen] = useState(false);
      const [isVenueMgmtOpen, setIsVenueMgmtOpen] = useState(false);
      const [isUserMgmtOpen, setIsUserMgmtOpen] = useState(false);
      const [rejectingBooking, setRejectingBooking] = useState(null);
      const [rejectionReasonInput, setRejectionReasonInput] = useState('');

      // New Booking Form State
      const [newVenueId, setNewVenueId] = useState(1);
      const [newDate, setNewDate] = useState('2026-09-16');
      const [newStartTime, setNewStartTime] = useState('09:00');
      const [newEndTime, setNewEndTime] = useState('12:00');
      const [newPurpose, setNewPurpose] = useState('');
      const [newAttendees, setNewAttendees] = useState(50);
      const [bookingConflictWarning, setBookingConflictWarning] = useState(null);

      // New Venue Form State
      const [newVenueName, setNewVenueName] = useState('');
      const [newVenueCode, setNewVenueCode] = useState('');
      const [newVenueBuilding, setNewVenueBuilding] = useState('');
      const [newVenueCapacity, setNewVenueCapacity] = useState(50);
      const [newVenueDesc, setNewVenueDesc] = useState('');

      // New User / Teacher Form State
      const [newUserCitizenId, setNewUserCitizenId] = useState('');
      const [newUserPassword, setNewUserPassword] = useState('');
      const [newUserName, setNewUserName] = useState('');
      const [newUserRole, setNewUserRole] = useState('teacher');
      const [newUserDept, setNewUserDept] = useState('');
      const [newUserAvatar, setNewUserAvatar] = useState('');

      // =========================================================================
      // SUPABASE DATA FETCHING & REALTIME
      // =========================================================================
      const loadAllData = useCallback(async () => {
        if (!supabaseClient) return;

        try {
          // 1. โหลดข้อมูลผู้ใช้ Profiles
          const { data: pData } = await supabaseClient
            .from('profiles')
            .select('*')
            .order('created_at', { ascending: true });

          if (pData && pData.length > 0) {
            setProfiles(pData.map(p => ({
              id: p.id,
              citizenId: p.citizen_id,
              password: p.password,
              name: p.full_name,
              role: p.role,
              department: p.department || 'กลุ่มสาระการเรียนรู้',
              avatar: p.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
              phone: p.phone
            })));
          }

          // 2. โหลดข้อมูลสถานที่ Venues
          const { data: vData } = await supabaseClient
            .from('venues')
            .select('*')
            .order('id', { ascending: true });

          if (vData && vData.length > 0) {
            setVenues(vData.map(v => ({
              id: v.id,
              name: v.name,
              code: v.code || '',
              building: v.building || '',
              capacity: v.capacity || 0,
              description: v.description || '',
              status: v.status || 'available',
              isActive: v.is_active !== false
            })));
          }

          // 3. โหลดข้อมูลการจอง Bookings
          const { data: bData } = await supabaseClient
            .from('bookings')
            .select(`
              *,
              profiles:user_id (id, full_name, department),
              reviewer:reviewed_by (full_name),
              venues:venue_id (id, name)
            `)
            .order('booking_date', { ascending: true })
            .order('start_time', { ascending: true });

          if (bData) {
            const mapped = bData.map(b => ({
              id: b.id,
              userId: b.user_id,
              userName: b.profiles?.full_name || 'ครูผู้สอน',
              userDepartment: b.profiles?.department || 'โรงเรียนสกลราชวิทยานุกุล',
              venueId: b.venue_id,
              venueName: b.venues?.name || 'สถานที่โรงเรียน',
              date: b.booking_date,
              startTime: b.start_time ? b.start_time.substring(0, 5) : '08:00',
              endTime: b.end_time ? b.end_time.substring(0, 5) : '10:00',
              purpose: b.purpose,
              attendeesCount: b.attendees_count || 1,
              status: b.status,
              createdAt: b.created_at ? b.created_at.substring(0, 16).replace('T', ' ') : '',
              rejectionReason: b.rejection_reason,
              respondedByAdminName: b.reviewer?.full_name,
              respondedAt: b.updated_at ? b.updated_at.substring(0, 16).replace('T', ' ') : '',
              hasBeenNotifiedToTeacher: b.is_read
            }));
            setBookings(mapped);
          }

          // 4. โหลดการแจ้งเตือนระบบ System Notifications
          const { data: nData } = await supabaseClient
            .from('system_notifications')
            .select('*')
            .order('created_at', { ascending: false });

          if (nData) {
            setSystemNotifications(nData);
          }
        } catch (err) {
          console.error('Error loading data from Supabase:', err);
        }
      }, []);

      useEffect(() => {
        loadAllData();

        if (supabaseClient) {
          const channel = supabaseClient
            .channel('prod-realtime-sync')
            .on('postgres_changes', { event: '*', schema: 'public', table: 'bookings' }, () => loadAllData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'venues' }, () => loadAllData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, () => loadAllData())
            .on('postgres_changes', { event: '*', schema: 'public', table: 'system_notifications' }, () => loadAllData())
            .subscribe();

          return () => {
            supabaseClient.removeChannel(channel);
          };
        }
      }, [loadAllData]);

      // Track if login popup notification has already been triggered
      const [hasTriggeredLoginPopup, setHasTriggeredLoginPopup] = useState(false);

      // Teacher Notification Auto-popup on Login (Only popup once when unacknowledged items exist)
      useEffect(() => {
        if (currentUser && currentUser.role === 'teacher' && !hasTriggeredLoginPopup) {
          const unacknowledged = bookings.filter(
            b => b.userId === currentUser.id && 
                 (b.status === 'rejected' || b.status === 'approved') && 
                 b.hasBeenNotifiedToTeacher === false
          );
          if (unacknowledged.length > 0) {
            setIsTeacherNotifOpen(true);
          }
          setHasTriggeredLoginPopup(true);
        }
      }, [currentUser, bookings, hasTriggeredLoginPopup]);

      // Conflict warning preview while filling quick booking form
      useEffect(() => {
        if (!newVenueId || !newDate || !newStartTime || !newEndTime) {
          setBookingConflictWarning(null);
          return;
        }
        const conflict = bookings.find(
          b => b.date === newDate &&
               Number(b.venueId) === Number(newVenueId) &&
               b.status !== 'rejected' &&
               isTimeOverlapping(newStartTime, newEndTime, b.startTime, b.endTime)
        );
        if (conflict) {
          setBookingConflictWarning(
            `⚠️ คำเตือน: มีรายการของ "${conflict.userName}" (${conflict.startTime} - ${conflict.endTime} น.) ในช่วงเวลานี้แล้ว คำขอนี้จะเข้าสู่การพิจารณาความทับซ้อน`
          );
        } else {
          setBookingConflictWarning(null);
        }
      }, [newVenueId, newDate, newStartTime, newEndTime, bookings]);

      // Conflict Detection Engine
      const conflictGroups = useMemo(() => {
        const groups = [];
        const activeBookings = bookings.filter(b => b.status === 'pending');
        const byDateVenue = new Map();

        activeBookings.forEach(b => {
          const key = `${b.date}_${b.venueId}`;
          if (!byDateVenue.has(key)) byDateVenue.set(key, []);
          byDateVenue.get(key).push(b);
        });

        byDateVenue.forEach((items) => {
          if (items.length > 1) {
            const conflicting = new Set();
            for (let i = 0; i < items.length; i++) {
              for (let j = i + 1; j < items.length; j++) {
                if (isTimeOverlapping(items[i].startTime, items[i].endTime, items[j].startTime, items[j].endTime)) {
                  conflicting.add(items[i]);
                  conflicting.add(items[j]);
                }
              }
            }

            if (conflicting.size > 1) {
              const sorted = Array.from(conflicting).sort((a, b) => a.startTime.localeCompare(b.startTime));
              const first = sorted[0];
              const minStart = sorted[0].startTime;
              const maxEnd = sorted.reduce((m, c) => c.endTime > m ? c.endTime : m, sorted[0].endTime);
              groups.push({
                venueId: first.venueId,
                venueName: first.venueName,
                date: first.date,
                timeRange: `${minStart} - ${maxEnd} น.`,
                bookings: sorted
              });
            }
          }
        });
        return groups;
      }, [bookings]);

      const conflictDates = useMemo(() => new Set(conflictGroups.map(g => g.date)), [conflictGroups]);

      // Teacher's own notifications
      const teacherNotifications = useMemo(() => {
        if (!currentUser || currentUser.role !== 'teacher') return [];
        return bookings.filter(b => b.userId === currentUser.id && (b.status === 'approved' || b.status === 'rejected'));
      }, [bookings, currentUser]);

      const unreadCount = useMemo(() => {
        if (!currentUser || currentUser.role !== 'teacher') return 0;
        return bookings.filter(b => b.userId === currentUser.id && b.hasBeenNotifiedToTeacher === false && (b.status === 'approved' || b.status === 'rejected')).length;
      }, [bookings, currentUser]);

      // =========================================================================
      // AUTHENTICATION (LOGIN & LOGOUT)
      // =========================================================================
      const handleLogin = async (e) => {
        e.preventDefault();
        setLoginError('');
        setLoginLoading(true);

        const cleanCitizenId = loginCitizenId.trim().replace(/-/g, '');
        const cleanPassword = loginPassword.trim();

        try {
          let userFound = null;

          // 1. ค้นหาใน Supabase
          if (supabaseClient) {
            const { data, error } = await supabaseClient
              .from('profiles')
              .select('*')
              .eq('citizen_id', cleanCitizenId)
              .eq('password', cleanPassword)
              .single();

            if (!error && data) {
              userFound = {
                id: data.id,
                citizenId: data.citizen_id,
                name: data.full_name,
                role: data.role,
                department: data.department || 'โรงเรียนสกลราชวิทยานุกุล',
                avatar: data.avatar_url || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150',
                phone: data.phone
              };
            }
          }

          // 2. Fallback ตรวจสอบจาก Local Profiles
          if (!userFound) {
            const matched = profiles.find(
              p => p.citizenId === cleanCitizenId && p.password === cleanPassword
            );
            if (matched) userFound = matched;
          }

          if (userFound) {
            setHasTriggeredLoginPopup(false);
            setCurrentUser(userFound);
            localStorage.setItem('sakonraj_logged_user', JSON.stringify(userFound));
          } else {
            setLoginError('เลขประจำตัวประชาชนหรือวัน/เดือน/ปีเกิด ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง');
          }
        } catch (err) {
          setLoginError('เกิดข้อผิดพลาดในการเชื่อมต่อ กรุณาลองใหม่');
        } finally {
          setLoginLoading(false);
        }
      };

      const handleLogout = () => {
        setHasTriggeredLoginPopup(false);
        setIsTeacherNotifOpen(false);
        setCurrentUser(null);
        localStorage.removeItem('sakonraj_logged_user');
        setLoginCitizenId('');
        setLoginPassword('');
      };

      // =========================================================================
      // CALENDAR NAVIGATION (PREV / NEXT MONTH)
      // =========================================================================
      const handlePrevMonth = () => {
        if (currentMonth === 0) {
          setCurrentMonth(11);
          setCurrentYear(prev => prev - 1);
        } else {
          setCurrentMonth(prev => prev - 1);
        }
      };

      const handleNextMonth = () => {
        if (currentMonth === 11) {
          setCurrentMonth(0);
          setCurrentYear(prev => prev + 1);
        } else {
          setCurrentMonth(prev => prev + 1);
        }
      };

      const handleCurrentMonth = () => {
        const today = new Date();
        setCurrentYear(today.getFullYear());
        setCurrentMonth(today.getMonth());
      };

      const calendarDays = useMemo(() => {
        const days = [];
        const firstDayIndex = new Date(currentYear, currentMonth, 1).getDay();
        const totalDays = new Date(currentYear, currentMonth + 1, 0).getDate();

        for (let i = 0; i < firstDayIndex; i++) {
          days.push({ dayNumber: null, dateStr: '' });
        }
        for (let d = 1; d <= totalDays; d++) {
          const monthStr = String(currentMonth + 1).padStart(2, '0');
          const dayStr = String(d).padStart(2, '0');
          days.push({ dayNumber: d, dateStr: `${currentYear}-${monthStr}-${dayStr}` });
        }
        return days;
      }, [currentYear, currentMonth]);

      // Selected Day items
      const selectedDateBookings = useMemo(() => {
        if (!currentUser) return [];
        // ถ้าเป็นครู ให้เห็นเฉพาะการจองของตนเอง
        if (currentUser.role === 'teacher') {
          return bookings.filter(b => b.date === selectedDate && b.userId === currentUser.id);
        }
        // ถ้าเป็นแอดมิน เห็นการจองทั้งหมด
        return bookings.filter(b => b.date === selectedDate);
      }, [bookings, selectedDate, currentUser]);

      const selectedDateConflicts = useMemo(() => conflictGroups.filter(g => g.date === selectedDate), [conflictGroups, selectedDate]);

      // =========================================================================
      // CRUD ACTIONS & ADMIN CONTROLS
      // =========================================================================
      const triggerActionMessage = (msg) => {
        setActionMessage(msg);
        setTimeout(() => setActionMessage(null), 4000);
      };

      // 1. ส่งคำขอจองสถานที่
      const handleCreateBooking = async (e) => {
        e.preventDefault();
        if (!currentUser || !newPurpose.trim()) return;

        const targetVenue = venues.find(v => Number(v.id) === Number(newVenueId));
        if (targetVenue && targetVenue.status === 'maintenance') {
          alert('ไม่สามารถจองได้: สถานที่นี้อยู่ระหว่างปิดปรับปรุงชั่วคราว');
          return;
        }

        const numericVenueId = Number(newVenueId);

        if (supabaseClient) {
          const { error } = await supabaseClient
            .from('bookings')
            .insert([{
              venue_id: numericVenueId,
              user_id: currentUser.id,
              purpose: newPurpose.trim(),
              attendees_count: Number(newAttendees) || 1,
              booking_date: newDate,
              start_time: newStartTime + ':00',
              end_time: newEndTime + ':00',
              status: 'pending',
              is_read: false
            }]);

          if (error) {
            alert('เกิดข้อผิดพลาด: ' + error.message);
            return;
          }
        }

        triggerActionMessage('✓ ส่งคำขอจองสถานที่เรียบร้อยแล้ว รอการอนุมัติจากแอดมิน');
        setIsQuickBookingOpen(false);
        setNewPurpose('');
        loadAllData();
      };

      // 2. แอดมินอนุมัติคำขอ
      const handleApproveBooking = async (bookingId) => {
        if (supabaseClient) {
          await supabaseClient
            .from('bookings')
            .update({
              status: 'approved',
              reviewed_by: currentUser.id,
              rejection_reason: null,
              is_read: false
            })
            .eq('id', bookingId);
        }
        triggerActionMessage(`✓ อนุมัติคำขอ #${bookingId} เรียบร้อยแล้ว`);
        loadAllData();
      };

      // 3. แอดมินไม่อนุมัติคำขอ (พร้อมระบุเหตุผล)
      const handleConfirmReject = async () => {
        if (!rejectingBooking || !rejectionReasonInput.trim()) return;

        if (supabaseClient) {
          await supabaseClient
            .from('bookings')
            .update({
              status: 'rejected',
              reviewed_by: currentUser.id,
              rejection_reason: rejectionReasonInput.trim(),
              is_read: false

            .eq('id', rejectingBooking.id);

        triggerActionMessage(`✓ ปฏิเสธคำขอ #${rejectingBooking.id} พร้อมส่งเหตุผลให้ครูแล้ว`);
        setRejectingBooking(null);
        setRejectionReasonInput('');
        loadAllData();
      };

      // 4. แอดมินเพิ่มสถานที่ใหม่
      const handleAddVenue = async (e) => {
        e.preventDefault();
        if (!newVenueName.trim()) return;

        if (supabaseClient) {
          const { data, error } = await supabaseClient
            .from('venues')
            .insert([{
              name: newVenueName.trim(),
              code: newVenueCode.trim() || null,
              building: newVenueBuilding.trim() || null,
              capacity: Number(newVenueCapacity) || 0,
              description: newVenueDesc.trim() || null,
              status: 'available',
              is_active: true
            }])
            .select()
            .single();

          if (!error && data) {
            // แจ้งเตือนครูทุกคน
            await supabaseClient
              .from('system_notifications')
              .insert([{
                title: '📢 เปิดให้บริการสถานที่ใหม่',
                message: `โรงเรียนเปิดให้บริการ "${data.name}" (${data.building}) ความจุ ${data.capacity} คน สามารถยื่นขอใช้งานได้แล้ว`,
                type: 'venue_added',
                venue_id: data.id,
                created_by: currentUser.id
              }]);
          }
        }

        triggerActionMessage('✓ เพิ่มสถานที่ใหม่และส่งการแจ้งเตือนถึงครูทุกคนเรียบร้อยแล้ว');
        setNewVenueName('');
        setNewVenueCode('');
        setNewVenueBuilding('');
        setNewVenueDesc('');
        loadAllData();
      };

      // 5. แอดมินสลับสถานะ ปิดปรับปรุงชั่วคราว
      const handleToggleVenueStatus = async (venue) => {
        const nextStatus = venue.status === 'maintenance' ? 'available' : 'maintenance';

        if (supabaseClient) {
          await supabaseClient
            .from('venues')
            .update({ status: nextStatus })
            .eq('id', venue.id);

          // ส่งการแจ้งเตือนไปยังครูทุกคน
          const noticeTitle = nextStatus === 'maintenance'
            ? '⚠️ แจ้งปิดปรับปรุงสถานที่ชั่วคราว'
            : '✅ เปิดให้บริการสถานที่ตามปกติ';

            ? `สถานที่ "${venue.name}" ปิดปรับปรุงชั่วคราวเพื่อซ่อมบำรุง ขออภัยในความไม่สะดวก`

          await supabaseClient
            .from('system_notifications')
            .insert([{
              title: noticeTitle,
              message: noticeMsg,
              type: 'venue_maintenance',
              venue_id: venue.id,

              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: VENUE MANAGEMENT (เฉพาะ Admin)
          ========================================================================== */}
          {isAdmin && isVenueMgmtOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-2xl w-full overflow-hidden flex flex-col max-h-[92vh]">
                <div className="bg-slate-900 p-5 text-white flex items-center justify-between">
                  <h3 className="text-lg font-bold">🏢 จัดการสถานที่และการปิดปรับปรุง</h3>
                  <button onClick={() => setIsVenueMgmtOpen(false)} className="text-white/80 hover:text-white text-lg">✕</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-6 flex-1">
                  {/* รายการสถานที่ทั้งหมด */}
                  <div>
                    <h4 className="text-sm font-bold text-slate-900 mb-3">รายชื่อสถานที่ในโรงเรียน</h4>
                    <div className="space-y-2.5">
                      {venues.map(v => (
                        <div key={v.id} className="p-4 rounded-xl border border-slate-200 bg-slate-50 flex items-center justify-between gap-3">
                          <div>
                            <div className="font-bold text-sm text-slate-900">{v.name}</div>
                            <div className="text-xs text-slate-500">{v.building} • ความจุ {v.capacity} คน</div>
                          </div>
                          <div className="flex items-center gap-2">
                            <span className={`px-2.5 py-1 rounded-full text-xs font-bold ${v.status === 'maintenance' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}`}>
                              {v.status === 'maintenance' ? 'ปิดปรับปรุง' : 'พร้อมใช้งาน'}
                            </span>
                            <button
                              onClick={() => handleToggleVenueStatus(v)}
                              className={`px-3 py-1 text-xs font-bold rounded-lg border transition ${
                                v.status === 'maintenance'
                                  ? 'bg-emerald-50 text-emerald-700 border-emerald-300 hover:bg-emerald-100'
                                  : 'bg-amber-50 text-amber-800 border-amber-300 hover:bg-amber-100'
                              }`}
                            >
                              {v.status === 'maintenance' ? 'เปิดใช้งาน' : 'ปิดปรับปรุงชั่วคราว'}
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* ฟอร์มเพิ่มสถานที่ใหม่ */}
                  <form onSubmit={handleAddVenue} className="p-5 rounded-2xl border border-slate-200 bg-white space-y-3">
                    <h4 className="text-sm font-bold text-slate-900">+ เพิ่มสถานที่ใหม่</h4>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อสถานที่ *</label>
                        <input
                          type="text"
                          value={newVenueName}
                          onChange={e => setNewVenueName(e.target.value)}
                          placeholder="เช่น ห้องปฏิบัติการดนตรีสากล"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">รหัสสถานที่</label>
                        <input
                          type="text"
                          value={newVenueCode}
                          onChange={e => setNewVenueCode(e.target.value)}
                          placeholder="เช่น LAB-MUS"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">อาคาร / ที่ตั้ง *</label>
                        <input
                          type="text"
                          value={newVenueBuilding}
                          onChange={e => setNewVenueBuilding(e.target.value)}
                          placeholder="เช่น อาคาร 3 ชั้น 1"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">ความจุ (คน)</label>
                        <input
                          type="number"
                          value={newVenueCapacity}
                          onChange={e => setNewVenueCapacity(e.target.value)}
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 mb-1">คำอธิบาย</label>
                      <textarea
                        value={newVenueDesc}
                        onChange={e => setNewVenueDesc(e.target.value)}
                        rows={2}
                        placeholder="รายละเอียดอุปกรณ์และสิ่งอำนวยความสะดวก..."
                        className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs"
                      />
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-red-800 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition"
                    >
                      บันทึกและส่งแจ้งเตือนให้ครูทุกคน
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: USER MANAGEMENT (เฉพาะ Admin)
          ========================================================================== */}
          {isAdmin && isUserMgmtOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-3xl w-full overflow-hidden flex flex-col max-h-[92vh]">
                <div className="bg-slate-900 p-5 text-white flex items-center justify-between">
                  <h3 className="text-lg font-bold">👥 จัดการรายชื่อครูและบุคลากร</h3>
                  <button onClick={() => setIsUserMgmtOpen(false)} className="text-white/80 hover:text-white text-lg">✕</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-6 flex-1">
                  {/* รายชื่อครูและแอดมิน */}
                  <div>
                    <h4 className="text-sm font-bold text-slate-900 mb-3">รายชื่อผู้ใช้งานทั้งหมดในระบบ ({profiles.length} ท่าน)</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 max-h-56 overflow-y-auto">
                      {profiles.map(p => (
                        <div key={p.id} className="p-3.5 rounded-xl border border-slate-200 bg-slate-50 flex items-center gap-3">
                          <img src={p.avatar} alt="" className="w-10 h-10 rounded-full object-cover ring-1 ring-slate-300" />
                          <div className="flex-1 min-w-0">
                            <div className="flex items-center gap-1.5">
                              <span className="font-bold text-xs text-slate-900 truncate">{p.name}</span>
                              <span className={`text-[9px] px-1.5 py-0.2 rounded-full font-semibold ${p.role === 'admin' ? 'bg-red-100 text-red-800' : 'bg-slate-200 text-slate-700'}`}>
                                {p.role === 'admin' ? 'แอดมิน' : 'ครู'}
                              </span>
                            </div>
                            <div className="text-[10px] text-slate-500 truncate">{p.department}</div>
                            <div className="text-[10px] text-slate-400">ID: {p.citizenId} | เกิด: {p.password}</div>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* ฟอร์มเพิ่มครูใหม่ */}
                  <form onSubmit={handleAddTeacher} className="p-5 rounded-2xl border border-slate-200 bg-white space-y-3">
                    <h4 className="text-sm font-bold text-slate-900">+ เพิ่มรายชื่อครูหรือแอดมินใหม่</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">เลขประจำตัวประชาชน (13 หลัก) *</label>
                        <input
                          type="text"
                          maxLength={13}
                          value={newUserCitizenId}
                          onChange={e => setNewUserCitizenId(e.target.value)}
                          placeholder="เช่น 1479900999999"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">วัน/เดือน/ปีเกิด (รหัสผ่าน) *</label>
                        <input
                          type="text"
                          value={newUserPassword}
                          onChange={e => setNewUserPassword(e.target.value)}
                          placeholder="เช่น 10/10/2535"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                          required
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">ชื่อ-นามสกุล *</label>
                        <input
                          type="text"
                          value={newUserName}
                          onChange={e => setNewUserName(e.target.value)}
                          placeholder="เช่น ครูสมชาย ใจกล้า"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                          required
                        />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">กลุ่มสาระการเรียนรู้ / หน่วยงาน</label>
                        <input
                          type="text"
                          value={newUserDept}
                          onChange={e => setNewUserDept(e.target.value)}
                          placeholder="เช่น กลุ่มสาระการเรียนรู้สังคมศึกษาฯ"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">สิทธิ์การใช้งาน (Role)</label>
                        <select
                          value={newUserRole}
                          onChange={e => setNewUserRole(e.target.value)}
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs font-medium"
                        >
                          <option value="teacher">คุณครู (Teacher)</option>
                          <option value="admin">ผู้ดูแลระบบ (Admin)</option>
                        </select>
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">ลิงก์รูปโปรไฟล์ (Avatar URL)</label>
                        <input
                          type="text"
                          value={newUserAvatar}
                          onChange={e => setNewUserAvatar(e.target.value)}
                          placeholder="https://... หรือปล่อยว่างเพื่อใช้รูปเริ่มต้น"
                          className="w-full p-2.5 bg-slate-50 border rounded-xl text-xs"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-red-800 hover:bg-red-700 text-white font-bold rounded-xl text-xs transition mt-2"
                    >
                      บันทึกรายชื่อลงฐานข้อมูล
                    </button>
                  </form>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: TEACHER NOTIFICATIONS (ผลการจอง + ประกาศสถานที่)
          ========================================================================== */}
          {isTeacherNotifOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-200 max-w-xl w-full overflow-hidden flex flex-col max-h-[90vh]">
                <div className="bg-red-800 p-5 text-white flex items-center justify-between">
                  <div className="flex items-center gap-2.5">
                    <span className="text-2xl">🔔</span>
                    <div>
                      <h3 className="text-lg font-bold">การแจ้งเตือนและข่าวสาร</h3>
                      <p className="text-xs text-red-100">โรงเรียนสกลราชวิทยานุกุล</p>
                    </div>
                  </div>
                  <button onClick={handleAcknowledgeNotifications} className="text-white/80 hover:text-white text-lg">✕</button>
                </div>

                <div className="p-6 overflow-y-auto space-y-4 flex-1">
                  {/* System Announcements */}
                  {systemNotifications.length > 0 && (
                    <div className="space-y-2">
                      <div className="text-xs font-bold text-slate-400 uppercase tracking-wider">ประกาศสถานที่จากงานอาคาร</div>
                      {systemNotifications.map(n => (
                        <div key={n.id} className="p-3.5 rounded-xl border border-amber-200 bg-amber-50 text-xs">
                          <div className="font-bold text-amber-900">{n.title}</div>
                          <p className="text-amber-800 mt-1">{n.message}</p>
                        </div>
                      ))}
                    </div>
                  )}

                  {/* Booking Results */}
                  <div className="text-xs font-bold text-slate-400 uppercase tracking-wider pt-2">ผลการพิจารณาคำขอจองของคุณ</div>
                  {teacherNotifications.length === 0 ? (
                    <div className="text-center py-6 text-slate-400 text-xs">ไม่มีรายการอัปเดตใหม่ในขณะนี้</div>
                  ) : (
                    teacherNotifications.map(item => (
                      <div
                        key={item.id}
                        className={`p-4 rounded-2xl border ${item.status === 'rejected' ? 'bg-rose-50/70 border-rose-300' : 'bg-emerald-50/70 border-emerald-300'}`}
                      >
                        <div className="flex items-center justify-between mb-2">
                          <span className={`px-2.5 py-0.5 rounded-full text-xs font-bold ${item.status === 'rejected' ? 'bg-rose-600 text-white' : 'bg-emerald-600 text-white'}`}>
                            {item.status === 'rejected' ? '❌ ไม่อนุมัติ' : '✅ อนุมัติแล้ว'}
                          </span>
                          <span className="text-[11px] text-slate-400">{item.respondedAt || item.createdAt}</span>
                        </div>

                        <h4 className="font-bold text-sm text-slate-900">{item.venueName}</h4>
                        <p className="text-xs text-slate-600">วันที่ {item.date} เวลา {item.startTime} - {item.endTime} น.</p>
                        <p className="text-xs text-slate-500 mt-0.5"><strong>กิจกรรม:</strong> {item.purpose}</p>

                        {item.status === 'rejected' && (
                          <div className="mt-3 p-3 bg-white rounded-xl border border-rose-200 shadow-xs">
                            <div className="text-xs font-bold text-rose-800 mb-1">เหตุผลที่ถูกปฏิเสธ:</div>
                            <p className="text-xs text-slate-800 bg-rose-50/60 p-2 rounded-lg">
                              {item.rejectionReason || 'ไม่ระบุเหตุผล'}
                            </p>
                            {item.respondedByAdminName && (
                              <div className="mt-1.5 text-[11px] text-slate-500">
                                ผู้ตอบกลับ: <strong className="text-slate-800">{item.respondedByAdminName}</strong>
                              </div>
                            )}
                          </div>
                        )}
                      </div>
                    ))
                  )}
                </div>

                <div className="p-4 bg-slate-50 border-t flex justify-end">
                  <button
                    onClick={handleAcknowledgeNotifications}
                    className="px-6 py-2.5 bg-red-800 text-white rounded-xl text-sm font-semibold hover:bg-red-700 transition"
                  >
                    รับทราบทั้งหมด
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* =========================================================================
              MODAL: MANDATORY REJECTION REASON (เฉพาะ Admin)
          ========================================================================== */}
          {rejectingBooking && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4 animate-fade-in">
              <div className="bg-white rounded-3xl shadow-2xl border border-rose-200 max-w-lg w-full overflow-hidden">
                <div className="bg-rose-800 p-5 text-white flex items-center justify-between">
                  <h3 className="text-base font-bold">ระบุเหตุผลที่ไม่อนุมัติคำขอ</h3>
                  <button onClick={() => setRejectingBooking(null)} className="text-white/80 hover:text-white">✕</button>
                </div>

                <div className="p-6 space-y-4">
                  <div className="p-3 bg-slate-50 rounded-xl border text-xs text-slate-700">
                    <div className="font-bold text-slate-900">{rejectingBooking.venueName}</div>
                    <div>ผู้ขอ: {rejectingBooking.userName} ({rejectingBooking.userDepartment})</div>
                    <div>วันที่: {rejectingBooking.date} เวลา: {rejectingBooking.startTime} - {rejectingBooking.endTime} น.</div>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 mb-1">
                      เหตุผลในการไม่อนุมัติ <span className="text-rose-600">* (จำเป็นต้องกรอก)</span>
                    </label>
                    <textarea
                      value={rejectionReasonInput}
                      onChange={e => setRejectionReasonInput(e.target.value)}
                      rows={4}
                      placeholder="พิมพ์เหตุผลที่ไม่อนุมัติ (บังคับกรอกก่อนกดยืนยัน)..."
                      className="w-full p-3 border rounded-xl text-sm focus:ring-2 focus:ring-rose-600 outline-none"
                    />
                    <div className="text-[11px] mt-1">
                      <span className={rejectionReasonInput.trim().length < 5 ? 'text-rose-600 font-semibold' : 'text-emerald-600'}>
                        {rejectionReasonInput.trim().length < 5 ? 'กรุณากรอกอย่างน้อย 5 ตัวอักษร' : '✓ ข้อมูลครบถ้วน'}
                      </span>
                    </div>
                  </div>

                  <div>
                    <div className="text-[11px] font-semibold text-slate-400 mb-1">เลือกข้อความสำเร็จรูป:</div>
                    <div className="flex flex-wrap gap-1.5">
                      {[
                        'เวลาทับซ้อนกับกิจกรรมหลักของโรงเรียนตามปฏิทินปฏิบัติงาน',
                        'ขออนุมัติให้อีกคำขอที่ยื่นก่อนหน้า ขออภัยในความไม่สะดวก',
                        'สถานที่อยู่ระหว่างการซ่อมบำรุงระบบปรับอากาศและระบบไฟฟ้า'
                      ].map((preset, idx) => (
                        <button
                          key={idx}
                          type="button"
                          onClick={() => setRejectionReasonInput(preset)}
                          className="text-[11px] px-2.5 py-1 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg"
                        >
                          + {preset.substring(0, 30)}...
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="pt-4 border-t flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setRejectingBooking(null)}
                      className="px-4 py-2 text-slate-600 rounded-xl text-sm font-semibold"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="button"
                      disabled={rejectionReasonInput.trim().length < 5}
                      onClick={handleConfirmReject}
                      className={`px-6 py-2 rounded-xl text-sm font-bold shadow-xs transition ${
                        rejectionReasonInput.trim().length >= 5
                          ? 'bg-rose-700 text-white cursor-pointer hover:bg-rose-800'
                          : 'bg-slate-200 text-slate-400 cursor-not-allowed'
                      }`}
                    >
                      ยืนยันการไม่อนุมัติคำขอ
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<FacilityBookingApp />);
  </script>
</body>
</html>
